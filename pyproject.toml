[project]
name = "task-management-api"
version = "1.0.0"
description = "Async REST API for task management built with FastAPI, SQLAlchemy 2 and PostgreSQL"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]
# async SQLAlchemy runs DB calls inside greenlets
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
show_missing = true
skip_covered = true
