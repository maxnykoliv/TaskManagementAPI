name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskuser
          POSTGRES_PASSWORD: taskpass
          POSTGRES_DB: taskdb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U taskuser -d taskdb"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://taskuser:taskpass@localhost:5432/taskdb
      TEST_DATABASE_URL: postgresql+asyncpg://taskuser:taskpass@localhost:5432/taskdb_test
      SECRET_KEY: ci-only-secret-key-that-is-at-least-32-bytes-long
      OVERDUE_WORKER_ENABLED: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Create test database
        run: PGPASSWORD=taskpass psql -h localhost -U taskuser -d taskdb -c "CREATE DATABASE taskdb_test;"
      - name: Migrations apply cleanly and match the models
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
      - run: pytest --cov --cov-report=term

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
